<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1 - Your First JavaScript Script</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 40px;
            color: #333;
        }
        .container {
            max-width: 700px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #1a73e8; }
        p { line-height: 1.6; }
        .instructions {
            background-color: #e8f0fe;
            border-left: 4px solid #1a73e8;
            padding: 12px 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lab 1: Your First JavaScript Script</h1>
        <p>This page loads <code>script.js</code> which runs in the browser console.</p>
        <div class="instructions">
            <strong>Browser Console Check:</strong> Press <kbd>F12</kbd> or <kbd>Ctrl + Shift + I</kbd>, open the <strong>Console</strong> tab to view script outputs.
        </div>
    </div>
    <script src="script.js"></script>

</html>
